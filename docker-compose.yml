services:
  logger:
    build: ./logger
    restart: unless-stopped  # comes back after crashes and VM reboots
    env_file: .env  # API keys and Healthchecks URLs, used as ${NAME} in config.toml
    volumes:
      - ./data:/data  # snapshots end up in ./data/raw on the VM
      - ./logger/config.toml:/config/config.toml:ro
    stop_grace_period: 30s  # time to finish a download before stopping
    logging:
      driver: json-file
      options:  # keep Docker's own log files from filling the disk
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # set in .env
      POSTGRES_DB: postgres
    ports:
      # Only the VM itself can connect (the pipeline runs there, outside Docker).
      # Docker's published ports bypass ufw, so never drop the 127.0.0.1.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # survives `docker compose down` and rebuilds

volumes:
  pgdata:

