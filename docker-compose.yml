services:
  logger:
    build: ./logger
    restart: unless-stopped  # comes back after crashes and VM reboots
    env_file: .env  # API keys and Healthchecks URLs, used as ${NAME} in config.toml
    volumes:
      - ./data:/data  # snapshots end up in ./data/raw on the VM
      - ./logger/config.toml:/config/config.toml:ro
    stop_grace_period: 30s  # time to finish a download before stopping
    logging:
      driver: json-file
      options:  # keep Docker's own log files from filling the disk
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # The default 128MB cache is more than the static schedule needs, and the VM has
    # 887 MiB for everything, including the nightly job.
    command: postgres -c shared_buffers=32MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # set in .env
      POSTGRES_DB: postgres
    ports:
      # Only the VM itself can connect (the pipeline runs there, outside Docker).
      # Docker's published ports bypass ufw, so never drop the 127.0.0.1.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # survives `docker compose down` and rebuilds

  api:
    build: ./api
    restart: unless-stopped
    depends_on: [db]  # not waited for: the API answers 503 until the database is up
    environment:
      DATA_DIR: /data
      # The db service by name, on Compose's network. Not DATABASE_URL from .env, which
      # is the nightly job's (127.0.0.1, outside Docker). POSTGRES_PASSWORD must be URL-safe.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      # Trust X-Forwarded-For/-Proto from any address: only Caddy and the VM itself can
      # reach port 8000 (below). Without it, redirects would say http:// behind HTTPS.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./data:/data:ro  # rollups/ from the nightly job, raw/ from the logger
    ports:
      # For curl and SSH tunnels on the VM; the public goes through Caddy. Docker's
      # published ports bypass ufw, so never drop the 127.0.0.1.
      - "127.0.0.1:8000:8000"
    mem_limit: 300m  # about 105 MiB in use with a month of rollups
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}  # set in .env; see proxy/Caddyfile
    ports:
      # Public on purpose. These bypass ufw too: Azure's network security group is
      # what opens or closes them.
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # certificates; keep them, or Let's Encrypt rate limits bite
      - caddy_config:/config
    mem_limit: 100m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  caddy_data:
  caddy_config:

