# Durham Region Transit (DRT). These feeds are public, so no API key is needed.
# They're published under the Region of Durham Open Data Licence v1.0, which
# allows this use. Crediting the Region is optional, but the app mustn't use
# DRT's logo or look official: https://durham.ca/en/regional-government/open-data.aspx
#
# config.example.toml explains every option. Commit this file.

data_dir = "/data/raw"
# Put your repo's URL here, so DRT can see who's polling.
user_agent = "transit-reliability-logger/0.1 (+https://github.com/samnguyen71/transit-reliability)"
min_free_gb = 2

# Polling every 30 s pins each arrival to within about half a minute, and
# on-time is judged in minutes.
[[feeds]]
name = "trip_updates"
url = "https://drtonline.durhamregiontransit.com/gtfsrealtime/TripUpdates"
interval_seconds = 30
# healthcheck_url = "${HC_TRIP_UPDATES}"

[[feeds]]
name = "vehicle_positions"
url = "https://drtonline.durhamregiontransit.com/gtfsrealtime/VehiclePositions"
interval_seconds = 30
# healthcheck_url = "${HC_VEHICLE_POSITIONS}"

# Service alerts: detours and cancellations, which can explain skipped stops.
# Small, and unchanged snapshots aren't stored again.
[[feeds]]
name = "alerts"
url = "https://maps.durham.ca/OpenDataGTFS/alerts.pb"
interval_seconds = 300

# The schedule. The current one ends in late November, so a new version will
# arrive in the middle of your data collection; the logger keeps each one.
[[feeds]]
name = "static_gtfs"
kind = "static"
url = "https://maps.durham.ca/OpenDataGTFS/GTFS_Durham_TXT.zip"
interval_seconds = 21600  # every 6 hours
